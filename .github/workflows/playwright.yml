name: Playwright Tests

# ▶️ მხოლოდ ხელით: GitHub → Actions → "Playwright Tests" → Run workflow → აირჩიე ნაკრები → Run
# ❌ push / pull request / განრიგი — ტესტებს თვითონ არასდროს უშვებს
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'რა გაეშვას'
        type: choice
        default: rs-back
        options:
          - all
          - rs-back
          - rs-front
          - payments
          - custom
      path:
        description: 'custom: ფაილი ან საქაღალდე (მაგ. tests/RS/Front/Positive/rs-front-foreign.spec.ts)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: playwright-tests
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 300
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        # chromium — ადმინ პანელი; chrome — გადახდის გვერდები (helper-ები channel: 'chrome')
        run: npx playwright install --with-deps chromium chrome

      # .env — GitHub secret DOTENV-იდან (ლოკალური .env-ის მთელი შიგთავსი); ფაილი მხოლოდ სერვერზე, git-ში არ ხვდება
      - name: Create .env
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -z "$DOTENV" ]; then echo "❌ secret DOTENV ცარიელია — Settings → Secrets and variables → Actions"; exit 1; fi
          printf '%s\n' "$DOTENV" > .env

      - name: Choose tests
        id: pick
        run: |
          SUITE="${{ github.event.inputs.suite }}"
          case "$SUITE" in
            rs-back)  TESTS="tests/RS/Back" ;;
            rs-front) TESTS="tests/RS/Front" ;;
            payments) TESTS="tests/Positive tests/Negative" ;;
            custom)   TESTS="${{ github.event.inputs.path }}" ;;
            *)        TESTS="tests/Positive tests/Negative tests/RS" ;;  # all — tests/Prod არასდროს
          esac
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "▶️ $SUITE: $TESTS"

      - name: Run Playwright tests
        continue-on-error: true
        env:
          NO_OPEN: '1'
        # xvfb — ვირტუალური ეკრანი (headed ბრაუზერისთვის; სერვერს ეკრანი არ აქვს)
        run: xvfb-run -a npx playwright test ${{ steps.pick.outputs.tests }}

      # report → docs/report → main-ზე commit → GitHub Pages: https://karto88.github.io/payments/report/
      # (push ტესტებს აღარ უშვებს — ციკლი არ იქნება)
      - name: Publish report to GitHub Pages
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/report
          git diff --cached --quiet && exit 0
          git commit -m "chore: CI report ${{ github.event.inputs.suite }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}

      - name: Upload test results (traces, errors)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Remove .env
        if: always()
        run: rm -f .env
